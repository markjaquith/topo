[package]
name = "topo-scan"
version = "0.1.0"
edition = "2024"
description = "Code topology mapper with an interactive local viewer"
readme = "README.md"
repository = "https://github.com/markjaquith/topo"
keywords = ["code-search", "topology", "ripgrep"]
categories = ["development-tools"]
license = "MIT"
exclude = ["AGENTS.md"]

[[bin]]
name = "topo"
path = "src/main.rs"

[dependencies]
ignore = "0.4"
regex = "1.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syntect = { version = "5.2", default-features = false, features = ["default-fancy"] }
toml = "0.8"
